<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23324F">
<title>Agenda Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: calendario mensile (turno sopra il giorno, attività da fare sotto) e foglio del giorno diviso in 4 riquadri di urgenza; stessa struttura su telefono e computer. */
:root{
  --bg:#ECEEF1; --paper:#FFFFFF; --sunk:#F5F6F8; --ink:#1A2233; --muted:#667085; --line:#DDE1E8;
  --accent:#23324F; --on-accent:#FFFFFF; --ok:#2E7D57; --late:#B4232F;
  --p1:#B4232F; --p2:#C77A1E; --p3:#2F62A8; --p4:#3C7D5E;
  --w1:#23324F; --w2:#2F5A7A; --w3:#2F6E6E; --w4:#4C6B45; --w5:#9A7A2C; --w6:#8E5568; --w7:#6E2B3D;
  --w5ink:#FFFFFF; --wink:#FFFFFF;
  --tint:6%;
  --f-script:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --paper:#161A22; --sunk:#1C212B; --ink:#E7EAF0; --muted:#98A1B3; --line:#29303D;
  --accent:#A9B8DA; --on-accent:#10141C; --ok:#5DC28E; --late:#F07A7F;
  --p1:#F07A7F; --p2:#E9A85A; --p3:#79A6E6; --p4:#6CC296;
  --w1:#8FA3CF; --w2:#78A9C9; --w3:#6FB3AE; --w4:#8EB384; --w5:#D4B05C; --w6:#CF94A8; --w7:#C9798D;
  --w5ink:#10141C; --wink:#10141C; --tint:9%;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --paper:#161A22; --sunk:#1C212B; --ink:#E7EAF0; --muted:#98A1B3; --line:#29303D;
  --accent:#A9B8DA; --on-accent:#10141C; --ok:#5DC28E; --late:#F07A7F;
  --p1:#F07A7F; --p2:#E9A85A; --p3:#79A6E6; --p4:#6CC296;
  --w1:#8FA3CF; --w2:#78A9C9; --w3:#6FB3AE; --w4:#8EB384; --w5:#D4B05C; --w6:#CF94A8; --w7:#C9798D;
  --w5ink:#10141C; --wink:#10141C; --tint:9%;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}
@media (min-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.tabs{display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--late)}
.btn.sm{padding:5px 11px;font-size:13px}
.nav{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:20px;line-height:1}

/* foglio di carta */
.paper{background:var(--paper);border-radius:12px;border:1px solid var(--line);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent),0 12px 32px color-mix(in srgb,var(--ink) 6%,transparent);position:relative;overflow:hidden}

/* MESE */
.mtop{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;flex-wrap:wrap}
.mtitle{flex:1;min-width:200px;display:flex;align-items:baseline;gap:12px}
.mname{font-family:var(--f-script);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1;margin:0;text-transform:capitalize;letter-spacing:-.01em}
.year{font-family:var(--f-body);font-weight:500;font-size:clamp(18px,3vw,24px);color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 18px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 14px 16px}
.wh{border-top:3px solid var(--wc);color:var(--wc);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:7px 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .s{display:none}
@media (max-width:640px){.wh .l{display:none}.wh .s{display:inline}.wh{font-size:10.5px;letter-spacing:.04em;padding:5px 1px}}
.cell{background:color-mix(in srgb,var(--wc) var(--tint),var(--paper));border:1px solid var(--line);border-radius:8px;min-height:108px;padding:6px;display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0;color:var(--ink)}
.cell:hover{border-color:var(--wc)}
.cell.out{background:var(--sunk);opacity:.5}
.cell.today{border:2px solid var(--accent);padding:5px}
.cell .sh{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--sc);color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cell{cursor:pointer}
.cell .sh{border:0;text-align:left;cursor:pointer;font-family:inherit}
.cell .sh.none{background:none;color:var(--muted);border:1px dashed transparent;font-weight:600;opacity:0;transition:opacity .15s}
.cell:hover .sh.none,.cell .sh.none:focus-visible{opacity:1;border-color:var(--line)}
@media (hover:none){.cell .sh.none{opacity:.55}}
.cell .sh .x{display:none}
.cell .d{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.cell.today .d{color:var(--accent)}
.cell .todo{margin-top:auto;display:flex;flex-direction:column;gap:3px}
.cell .pp{display:flex;gap:3px;flex-wrap:wrap}
.cell .pp b{font-size:10.5px;font-weight:800;min-width:18px;height:17px;padding:0 4px;border-radius:9px;background:color-mix(in srgb,var(--pc) 15%,var(--paper));color:var(--pc);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell .ct{font-size:11px;font-weight:600;color:var(--muted)}
.cell .ct.all{color:var(--ok)}
@media (max-width:640px){
  .mgrid{padding:0 6px 10px;gap:2px}.mtop{padding:14px 10px 10px}.legend{padding:0 10px 10px}
  .cell{min-height:76px;padding:3px;border-radius:5px;gap:3px}.cell.today{padding:2px}
  .cell .sh{font-size:9px;padding:1px 2px;border-radius:3px}.cell .sh .f{display:none}.cell .sh .x{display:inline}
  .cell .d{font-size:12.5px}.cell .ct{display:none}
  .cell .pp b{font-size:9px;min-width:14px;height:14px;padding:0 2px}
}

/* GIORNO */
.dtop{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;flex-wrap:wrap}
.dtitle{flex:1;min-width:190px}
.dtitle .rel{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--wc)}
.dtitle h2{margin:0;font-family:var(--f-script);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.1}
.count{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:140px}
.count b{font-family:var(--f-mono);font-size:15px}
.bar{width:140px;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.dband{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 16px 10px}
.shift{display:inline-flex;gap:8px;align-items:center;padding:6px 11px;border-radius:6px;background:color-mix(in srgb,var(--sc) 18%,var(--paper));border:1px solid color-mix(in srgb,var(--sc) 45%,transparent);font-size:14px}
.shift b{font-weight:800}
.shift span{font-family:var(--f-mono);font-size:12.5px}
.addshift{border:1px dashed var(--line);background:none;border-radius:6px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.q{min-width:0;min-height:230px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--qc) 5%,var(--paper))}
.q:nth-child(odd){border-right:1px solid var(--line)}
.q:nth-child(-n+2){border-bottom:1px solid var(--line)}
.q header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:4px solid var(--qc)}
.q header h3{margin:0;font-size:15px;font-weight:800;color:var(--qc);flex:1;text-transform:uppercase;letter-spacing:.05em}
.q header .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0 0 4px}
.item{display:flex;gap:9px;align-items:flex-start;padding:7px 12px;cursor:default}
.item + .item{border-top:1px dotted var(--line)}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid color-mix(in srgb,var(--qc) 60%,var(--line));background:var(--paper);display:grid;place-items:center;padding:0;margin-top:1px}
.chk svg{width:14px;height:14px;opacity:0}
.item.done .chk{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.item.done .chk svg{opacity:1}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:12px;color:var(--muted);align-items:center}
.rep{font-weight:800;font-size:11px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--paper);letter-spacing:.02em}
.by{font-family:var(--f-mono);font-size:11.5px;color:var(--ink)}
.by.late{color:var(--late);font-weight:700}
.tag{font-size:11px;font-weight:700;color:var(--late)}
.addrow{margin-top:auto;padding:8px 12px 12px;color:var(--muted);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left}
.addrow span{width:22px;height:22px;border-radius:6px;border:2px dashed color-mix(in srgb,var(--qc) 55%,var(--line));display:grid;place-items:center;color:var(--qc);font-weight:800}
.q:hover .addrow{color:var(--qc)}
.q .tile,.q .back{display:none}
@media (max-width:640px){
  .quad{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:2px 4px 8px;border-top:0}
  .q{min-height:0;border:1px solid var(--line)!important;border-top:5px solid var(--qc)!important;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:color-mix(in srgb,var(--qc) 7%,var(--paper))}
  .q header{padding:7px 7px 2px 10px;border-top:0;gap:6px}.q header h3{font-size:12px;letter-spacing:.03em;line-height:1.15}.q header .n{display:none}
  .q .qadd{width:32px;height:32px;font-size:22px}
  .q .tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-height:0;border:0;background:none;padding:2px 10px 10px;text-align:left;width:100%;overflow:hidden}
  .tile .tn{font-size:34px;font-weight:800;line-height:1;color:var(--qc);font-variant-numeric:tabular-nums}
  .tile .tl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .tile .pv{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;width:100%;min-width:0}
  .tile .pv li{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px;border-left:2px solid var(--qc)}
  .tile .pv li.more{border-left:0;padding-left:0;color:var(--muted);font-weight:600}
  .tile .pe{margin-top:auto;font-size:12px;color:var(--muted)}
  .q .list,.q .addrow,.q .qe{display:none}
  .quad.has-focus .q:not(.focus){display:none}
  .q.focus{grid-column:1/-1;aspect-ratio:auto}
  .q.focus .tile{display:none}
  .q.focus .list,.q.focus .addrow,.q.focus .qe{display:flex}
  .q.focus .list{display:block}
  .q.focus header{padding:10px 12px}.q.focus header h3{font-size:15px}.q.focus header .n{display:inline}
  .q.focus .back{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:20px;line-height:1}
  .item{padding:11px 14px;gap:12px}.item .t{font-size:15.5px}.chk{width:26px;height:26px;border-radius:7px}.chk svg{width:16px;height:16px}
  .addrow{padding:10px 14px 14px;font-size:14.5px;width:100%}.addrow span{width:26px;height:26px}
  .dtop{padding:8px 10px 6px;gap:6px}.dband,.filters{padding-left:10px;padding-right:10px}
  .dtitle{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .dtitle .rel{font-size:10.5px}.dtitle h2{font-size:18px;font-family:var(--f-body);font-weight:700}
  .count{flex-direction:row;align-items:center;width:100%;gap:8px;min-width:0}.count b{font-size:12px;white-space:nowrap}.bar{flex:1;width:auto;height:6px}
  .dtop .nav{width:30px;height:30px;font-size:17px}
  .dband{padding-bottom:6px}.shift{padding:4px 9px;font-size:12.5px}.addshift{padding:4px 9px;font-size:12px}
  .filters{padding-bottom:8px}.chip{padding:5px 11px;font-size:12.5px}
  .chip{padding:7px 13px;font-size:13.5px}
  .top{display:none}
  .wrap{padding-block:8px 74px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .inp,.big,select{font-size:16px!important}
  .seg button{padding:9px 12px;font-size:14.5px;min-width:46px}
  .sheet .actions .btn{padding:11px 16px;font-size:15px}
}
.bnav{display:none}
@media (max-width:640px){
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--line);
    padding:4px env(safe-area-inset-right,0px) calc(4px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:700;color:var(--muted);padding:2px 0}
  .bnav button svg{width:18px;height:18px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .plus span{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
  .bnav .plus span svg{width:20px;height:20px}
  .toast{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}
.qadd{flex:none;width:30px;height:30px;border-radius:8px;border:0;background:var(--qc);color:var(--paper);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.qe{padding:6px 12px;color:var(--muted);font-size:13px}
.hello{padding:12px 16px 14px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.hello b{color:var(--ink)}

/* pannello */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:13px;border-top:5px solid var(--qc,var(--accent))}
@media (min-width:700px){.sheet{border-radius:12px}}
.sheet h3{margin:0;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--qc,var(--muted))}
.big{border:0;border-bottom:2px solid var(--line);background:none;font-size:20px;font-weight:600;padding:6px 2px;width:100%;min-width:0}
.big:focus{outline:none;border-color:var(--qc,var(--accent))}
.field{display:grid;gap:6px}
.lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 10px;font-size:13.5px;font-weight:700;color:var(--muted);min-width:40px}
.seg button[aria-pressed="true"]{border-color:var(--sel,var(--ink));background:var(--sel,var(--ink));color:var(--selink,var(--paper))}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.inp{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.hint a{color:var(--accent);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{background:color-mix(in srgb,var(--late) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--late) 35%,transparent);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.confirm span{flex:1;min-width:150px}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;height:150px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  -webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wcol{height:150px;width:58px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:57px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wcol::-webkit-scrollbar{display:none}
.wi{height:36px;scroll-snap-align:center;display:grid;place-items:center;font-family:var(--f-mono);font-size:21px;font-weight:700;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.wsep{font-family:var(--f-mono);font-size:21px;font-weight:700}
.wband{position:absolute;left:8px;right:8px;top:57px;height:36px;border-radius:8px;background:color-mix(in srgb,var(--qc,var(--accent)) 14%,transparent);pointer-events:none}
.alarmbtn{display:block;text-align:center;text-decoration:none;background:var(--p1);color:var(--paper);border-radius:10px;padding:12px;font-weight:800;font-size:15px}
.tbtn{border:1px dashed var(--line);background:var(--paper);border-radius:8px;padding:10px;font-weight:700;color:var(--muted);width:100%}
.tline{display:flex;justify-content:space-between;align-items:center}
.tline button{border:0;background:none;color:var(--late);font-weight:700;font-size:13px;padding:2px 4px}
.err{color:var(--late);font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}

<script>
(function(){
"use strict";
const PRI=[{k:1,n:"Urgente",c:"var(--p1)"},{k:2,n:"Importante",c:"var(--p2)"},{k:3,n:"Da organizzare",c:"var(--p3)"},{k:4,n:"Informazioni",c:"var(--p4)"}];
const REP=["D1","D2","D5","D7","D8","D11","D15","D16","D23","D25","P&C","Cash Office","Store"];
const SHC=[{k:"a",c:"var(--w1)"},{k:"b",c:"var(--w4)"},{k:"c",c:"var(--p2)"},{k:"d",c:"var(--w7)"}];
const WD=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const WDL=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const MON=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const ALARMS=[{v:"",n:"Nessuna sveglia"},{v:"0",n:"All'ora indicata"},{v:"15",n:"15 minuti prima"},{v:"30",n:"30 minuti prima"},{v:"60",n:"1 ora prima"}];
const priOf=k=>PRI.find(p=>p.k===Number(k))||PRI[2];
const shcOf=k=>(SHC.find(s=>s.k===k)||SHC[0]).c;
const wcOf=w=>"var(--w"+w+")";

const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const wd=s=>((parse(s).getDay()+6)%7)+1;
const shortDate=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()].slice(0,3)};
const longDate=s=>{const d=parse(s);return WDL[wd(s)-1]+" "+d.getDate()+" "+MON[d.getMonth()]};
function relLabel(s){const t=today();if(s===t)return"Oggi";if(s===addDays(t,1))return"Domani";if(s===addDays(t,-1))return"Ieri";return WDL[wd(s)-1]}
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const S={focus:null,view:"home",tpl:new Map(),tplId:"",email:"",date:today(),month:today().slice(0,8)+"01",rep:ls.get("ag2.rep")||"",
  rules:new Map(),tasksOpen:new Map(),tasksRecent:new Map(),tasks:new Map(),done:new Map(),
  ready:{rules:false,open:false,recent:false,done:false},base:null,noData:false};
const main=document.getElementById("main");

/* ---------- calcolo ---------- */
function tasksOn(d,withCarry){
  const w=wd(d),t=today(),out=[];
  for(const [id,r] of S.rules){
    if(r.kind!=="task"||!(r.days||[]).includes(w))continue;
    if(r.from&&d<r.from)continue;
    if((r.skip||[]).includes(d))continue;
    out.push({id,src:"rule",it:r,date:d,done:S.done.has(id+"_"+d),key:id+"_"+d});
  }
  for(const [id,x] of S.tasks){
    if(x.date===d)out.push({id,src:"task",it:x,date:d,done:x.open===false,key:id});
    else if(withCarry&&d===t&&x.open!==false&&x.date<t)out.push({id,src:"task",it:x,date:x.date,done:false,key:id,carry:true});
  }
  for(const s of shiftsOn(d)){const tp=s.it.tpl&&S.tpl.get(s.it.tpl);if(!tp)continue;
    (tp.tasks||[]).forEach(k=>{const key="T_"+s.id+"_"+k.id+"_"+d,dn=S.done.get(key);if(dn&&dn.skip)return;
      out.push({id:k.id,src:"tpl",tplId:s.it.tpl,shiftId:s.id,tplName:tp.name,it:Object.assign({days:[]},k),date:d,done:!!dn,key})})}
  return out;
}
function shiftsOn(d){
  const w=wd(d),out=[];
  for(const [id,r] of S.rules){
    if(r.kind!=="shift")continue;
    if(r.repeat){if(!(r.days||[]).includes(w)||(r.from&&d<r.from)||(r.skip||[]).includes(d))continue}
    else if(r.date!==d)continue;
    out.push({id,it:resolveShift(r)});
  }
  return out.sort((a,b)=>(a.it.start||"").localeCompare(b.it.start||""));
}
const sortOcc=(a,b)=>(a.done-b.done)||((a.it.by||"99").localeCompare(b.it.by||"99"))||(a.it.title||"").localeCompare(b.it.title||"");

/* ---------- salvataggio ---------- */
const col=n=>S.base.collection(n);
async function safe(p,msg){
  try{await p;if(msg)toast(msg);return true}
  catch(e){const c=e&&e.code;toast(c==="quota_exceeded"?"Spazio pieno: elimina qualche attività vecchia.":c==="unavailable"?"Connessione instabile: riprova tra poco.":"Salvataggio non riuscito. Riprova.");return false}
}
function showLogin(mode,msg){
  S.noData=true;S.base=null;
  const reg=mode==="register",rst=mode==="reset";

/* notifiche sul telefono: prossimi 7 giorni */
let notifT=null,notifSig="";
function alarmAt(o){const it=o.it;if(!it.by||it.alarm===""||it.alarm==null)return null;const [hh,mm]=it.by.split(":").map(Number);const d=parse(o.date);d.setHours(hh,mm-Number(it.alarm),0,0);return d}
function hashId(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
function queueNotifs(){
  if(!AG.native)return;
  clearTimeout(notifT);notifT=setTimeout(()=>{
    const t=today(),list=[];
    for(let i=0;i<8;i++){const d=addDays(t,i);for(const o of tasksOn(d,false)){if(o.done)continue;const at=alarmAt(o);if(!at)continue;
      list.push({id:hashId(o.key+"@"+d),at,date:d,title:"⏰ "+o.it.title,body:"Entro le "+o.it.by+" · "+priOf(o.it.pri).n+(o.it.rep?" · "+o.it.rep:"")})}}
    list.sort((a,b)=>a.at-b.at);
    const sig=list.map(n=>n.id+":"+n.at.getTime()).join("|");
    if(sig===notifSig)return;notifSig=sig;AG.scheduleNotifs(list);
  },1200);
}

const WH=36,HOURS=[...Array(24).keys()].map(pad),MINS=[...Array(60).keys()].map(pad);
function wheelHTML(id,val){
  const [h,m]=(val||"09:00").split(":");const mm=pad(Math.min(59,Math.max(0,Number(m)||0)));
  const col=(part,arr,cur)=>'<div class="wcol" data-part="'+part+'" data-cur="'+cur+'">'+arr.map(v=>'<div class="wi" data-v="'+v+'">'+v+'</div>').join("")+'</div>';
  return '<div class="wheel" id="'+id+'"><div class="wband"></div>'+col("h",HOURS,h)+'<span class="wsep">:</span>'+col("m",MINS,mm)+'</div>';
}
function wheelVal(id){const w=document.getElementById(id);if(!w)return null;const c=w.querySelectorAll(".wcol");return c[0].dataset.cur+":"+c[1].dataset.cur}
function wireWheels(root,onchange){
  root.querySelectorAll(".wheel").forEach(w=>w.querySelectorAll(".wcol").forEach(c=>{
    const items=[...c.children];const idx=Math.max(0,items.findIndex(i=>i.dataset.v===c.dataset.cur));
    c.scrollTop=idx*WH;
    const mark=()=>items.forEach((it,i)=>it.style.color=i===idx2()?"var(--ink)":"");
    const idx2=()=>Math.min(items.length-1,Math.max(0,Math.round(c.scrollTop/WH)));
    let t;c.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{const i=idx2();c.dataset.cur=items[i].dataset.v;mark();onchange&&onchange()},90)},{passive:true});
    items.forEach((it,i)=>it.onclick=()=>c.scrollTo({top:i*WH,behavior:"smooth"}));
    requestAnimationFrame(()=>{c.scrollTop=idx*WH;mark()});
  }));
}

function fmtTyping(v){const d=v.replace(/\D/g,"").slice(0,4);return d.length>2?d.slice(0,d.length-2)+":"+d.slice(-2):d}
function normTime(v){v=(v||"").trim();if(!v)return"";const d=v.replace(/\D/g,"");let h,m;
  if(v.includes(":")){const [a,b]=v.split(":");h=Number(a);m=Number(b||0)}
  else if(d.length<=2){h=Number(d);m=0}else{h=Number(d.slice(0,d.length-2));m=Number(d.slice(-2))}
  if(!(h>=0&&h<24&&m>=0&&m<60))return null;return pad(h)+":"+pad(m)}

  if(!st.by||st.alarm===""||st.alarm==null)return false;

/* ---------- PALLET · PIANO 3 SETTIMANE ---------- */
const PAL0={start:"",note:"",days:{}};
S.pal=Object.assign({},PAL0);S.palPending=false;
const num=v=>{const n=Number(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0};
const mondayOf=d=>addDays(d,-(wd(d)-1));
const shortDay=d=>WD[wd(d)-1]+" "+parse(d).getDate();
const has=v=>v!==undefined&&v!==null&&v!=="";
/* stessi calcoli del foglio: alle 9 = iniziali − notte − mattina; fine = alle 9 + ricevuti; il giorno dopo parte dal fine giornata */
/* righe di 21 giorni a partire da "inizio piano + off settimane".
   Dopo l'inizio del piano si calcola in avanti dai pallet di partenza; prima, all'indietro (iniziali = fine + lavorati − ricevuti). */
function palRows(p,off){p=p||S.pal;if(off==null)off=S.palOff||0;const start=p.start||mondayOf(today()),ws=addDays(start,off*7),last=addDays(ws,20),days=p.days||{};
  const g=d=>{const x=days[d]||{};return {x,n:num(x.n),m:num(x.m),r:num(x.r)}},c={};
  /* conteggio continuo: i pallet iniziali di ogni giorno sono la chiusura del giorno prima (si parte da 0 al primo giorno registrato) */
  const ks=Object.keys(days).sort(),d0=ks.length&&ks[0]<ws?ks[0]:ws;
  /* nei giorni da oggi in poi senza lavorati inseriti si usa la stima (media dell'ultimo mese per quel giorno della settimana) */
  const t=today(),E=palEst().w;
  let cur=0;for(let d=d0;d<=last;d=addDays(d,1)){const v=g(d);if(has(v.x.open))cur=num(v.x.open);let n=v.n,m=v.m,est=false;
    if(d>=t&&!has(v.x.n)&&!has(v.x.m)){const e=E[wd(d)-1];if(e.n!=null||e.m!=null){n=Math.round(e.n||0);m=Math.round(e.m||0);est=true}}
    const ini=cur,at9=ini-n-m,end=at9+v.r;c[d]={ini,at9,end,est};cur=end}
  const out=[];for(let i=0;i<21;i++){const d=addDays(ws,i),v=g(d);out.push(Object.assign({d,i,n:v.n,m:v.m,r:v.r,x:v.x},c[d]))}
  return out}
S.palOff=0;
function palMinOff(){const st=S.pal.start||mondayOf(today()),ks=Object.keys(S.pal.days||{}).sort(),first=ks.length&&ks[0]<st?ks[0]:st;
  return Math.min(-5,-Math.ceil((parse(st)-parse(first))/(7*864e5)))}
function palSave(next){S.pal=next;return safe(col("pallet").doc("plan").set(next))}
function palSetDay(d,patch){const days=Object.assign({},S.pal.days||{}),x=Object.assign({},days[d]||{},patch);
  if("n" in patch||"m" in patch)delete x.est;
  Object.keys(x).forEach(k=>{if(!has(x[k]))delete x[k]});if(Object.keys(x).length)days[d]=x;else delete days[d];
  return palSave(Object.assign({},S.pal,{days}))}
function palSnapshot(){if(S.view==="pal")render()}

function palChart(rows){
  const W=640,H=170,pl=30,pr=6,pt=10,pb=34,vals=rows.map(r=>r.end).concat(rows.map(r=>r.at9));
  const max=Math.max(10,...vals),min=Math.min(0,...vals),sy=v=>pt+(H-pt-pb)*(max-v)/(max-min),bw=(W-pl-pr)/21,t=today();
  const step=max-min>120?50:max-min>60?20:10;let g="";
  for(let v=Math.ceil(min/step)*step;v<=max;v+=step)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="var(--line)"'+(v===0?' stroke-width="1.5"':'')+'/><text x="'+(pl-5)+'" y="'+(sy(v)+3.5)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+v+'</text>';
  rows.forEach((r,i)=>{const x=pl+i*bw+bw*.16,w=bw*.68,y0=sy(0),y=sy(r.end),neg=r.end<0;
    g+='<rect x="'+x+'" y="'+Math.min(y,y0)+'" width="'+w+'" height="'+Math.max(1,Math.abs(y0-y))+'" rx="2" fill="'+(neg?'var(--p1)':r.d===t?'var(--accent)':'color-mix(in srgb,var(--accent) 45%,var(--paper))')+'"'+(r.est?' fill-opacity=".35" stroke="var(--accent)" stroke-dasharray="3 2"':'')+'><title>'+shortDay(r.d)+(r.est?' (stima)':'')+': fine giornata '+r.end+'</title></rect>';
    g+='<circle cx="'+(x+w/2)+'" cy="'+sy(r.at9)+'" r="2.6" fill="'+(r.at9<0?'var(--p1)':'var(--p2)')+'"><title>'+shortDay(r.d)+': alle 9 '+r.at9+'</title></circle>';
    const lc=r.d===t?'var(--accent)':'var(--muted)',fw=r.d===t?' font-weight="800"':'';
    g+='<text x="'+(x+w/2)+'" y="'+(H-19)+'" font-size="11" text-anchor="middle" fill="'+(r.d===t?'var(--accent)':'var(--ink)')+'"'+fw+'>'+parse(r.d).getDate()+'</text><text x="'+(x+w/2)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="'+lc+'"'+fw+'>'+WD[wd(r.d)-1]+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pallet a fine giornata nei 21 giorni">'+g+'</svg>';
}

/* produttività: media pallet lavorati per turno (solo i turni in cui si è lavorato) */
function palProd(rows,k){const l=rows.filter(r=>r[k]>0),tot=l.reduce((s,r)=>s+r[k],0);return {n:l.length,tot,avg:l.length?tot/l.length:0,best:l.reduce((m,r)=>Math.max(m,r[k]),0)}}
function palKpi(rows){
  const t=today(),first=rows[0].d,now=rows.find(r=>r.d===t),pn=palProd(rows,"n"),pm=palProd(rows,"m"),neg=rows.filter(r=>r.at9<0||r.end<0).length;
  const f=x=>(Math.round(x*10)/10).toLocaleString("it-IT");
  return '<div class="ukpi"><div class="k" style="--kc:var(--accent)"><b>'+f(pn.avg)+'<small> pallet/notte</small></b><span>Produttività notturno · '+pn.tot+' in '+pn.n+(pn.n===1?' notte':' notti')+(pn.best?' · max '+pn.best:'')+'</span></div>'+
    '<div class="k" style="--kc:var(--p2)"><b>'+f(pm.avg)+'<small> pallet/turno</small></b><span>Produttività alle 6 · '+pm.tot+' in '+pm.n+(pm.n===1?' turno':' turni')+(pm.best?' · max '+pm.best:'')+'</span></div>'+
    '<div class="k"><b>'+(now?now.end:(t<first?rows[0].ini:rows[20].end))+'</b><span>'+(now?'Pallet oggi a fine giornata':t<first?'Pallet di partenza':'Pallet a fine piano')+'</span></div>'+
    '<div class="k" style="--kc:'+(neg?'var(--p1)':'var(--ok)')+'"><b>'+rows[20].end+'</b><span>Pallet a fine piano · '+esc(shortDay(rows[20].d))+'</span></div></div>';
}
/* stima: media per giorno della settimana dei pallet lavorati con i dati dell'ultimo mese (28 giorni prima di oggi) */
function palEst(){
  const t=today(),from=addDays(t,-28),to=addDays(t,-1),acc={};for(let w=1;w<=7;w++)acc[w]={n:[],m:[]};
  Object.entries(S.pal.days||{}).forEach(([d,x])=>{if(d<from||d>to||x.est)return;const w=wd(d);if(!has(x.n)&&!has(x.m))return;acc[w].n.push(num(x.n));acc[w].m.push(num(x.m))});
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const w=[1,2,3,4,5,6,7].map(k=>({w:k,n:avg(acc[k].n),m:avg(acc[k].m),c:Math.max(acc[k].n.length,acc[k].m.length)}));
  return {from,to,w,any:w.some(x=>x.n!=null||x.m!=null)};
}
function palPh(r,k){if(k==="r"||r.d<today())return "0";const e=palEst().w[wd(r.d)-1];const v=k==="n"?e.n:e.m;return v==null?"0":"~"+Math.round(v)}
function palEstHTML(){
  const e=palEst(),t=today(),f=v=>v==null?'<span class="na">—</span>':(Math.round(v*10)/10).toLocaleString("it-IT");
  let h='<div class="shead"><h3>Stima pallet lavorati</h3></div><p class="hint sp0">Media per giorno della settimana con i dati dell\'ultimo mese ('+esc(shortDate(e.from))+' – '+esc(shortDate(e.to))+')</p>';
  if(!e.any)return h+'<p class="hint">Non ci sono ancora dati nell\'ultimo mese: la stima comparirà man mano che compili i lavorati.</p>';
  h+='<table class="etab"><thead><tr><th>Giorno</th><th>Notturno</th><th>Alle 6</th><th>Totale</th></tr></thead><tbody>';
  let tn=0,tm=0;
  e.w.forEach(x=>{const tot=(x.n||0)+(x.m||0);tn+=x.n||0;tm+=x.m||0;
    h+='<tr'+(x.w===wd(t)?' class="today"':'')+'><td><b>'+WDL[x.w-1]+'</b>'+(x.c?'<small>'+x.c+(x.c===1?' giorno':' giorni')+'</small>':'')+'</td><td>'+f(x.n)+'</td><td>'+f(x.m)+'</td><td class="t">'+(x.n==null&&x.m==null?'<span class="na">—</span>':f(tot))+'</td></tr>'});
  h+='</tbody><tfoot><tr><td>Settimana</td><td>'+f(tn)+'</td><td>'+f(tm)+'</td><td class="t">'+f(tn+tm)+'</td></tr></tfoot></table>';
  const empty=palRows(null,0).filter(r=>r.d>=t&&!has(r.x.n)&&!has(r.x.m)).length;
  h+='<p class="hint" style="margin:8px 0">Nei giorni da oggi in poi senza lavorati inseriti la stima è già usata nel calcolo: i pallet alle 9 e a fine giornata compaiono in corsivo con ≈. Le giornate inserite con la stima non entrano nella media finché non le correggi.</p><button class="btn sm" id="pFill">Inserisci la stima…</button>';
  return h;
}
function bindEst(){const b=document.getElementById("pFill");if(!b)return;b.onclick=()=>{
  const e=palEst(),t=today(),rows=palRows(),dFrom=rows[0].d>t?rows[0].d:(rows[20].d<t?rows[0].d:t),dTo=rows[20].d;
  let h='<h3>Inserisci la stima</h3><p class="hint" style="margin:0">Scrivo nei giorni scelti la media dell\'ultimo mese per quel giorno della settimana (notturno e alle 6). Potrai correggere ogni valore.</p>';
  h+='<div class="grid2"><div class="field"><label class="lbl" for="ef-from">Dal giorno</label><input class="inp" type="date" id="ef-from" value="'+dFrom+'"></div><div class="field"><label class="lbl" for="ef-to">Al giorno</label><input class="inp" type="date" id="ef-to" value="'+dTo+'"></div></div>';
  h+='<label class="chkl"><input type="checkbox" id="ef-over"> Sovrascrivi anche i giorni già compilati</label><div class="hint" id="ef-info"></div><div class="err" id="err" hidden></div>';
  h+='<div class="actions"><span class="sp"></span><button type="button" class="btn" id="cancel">Annulla</button><button type="submit" class="btn primary">Inserisci</button></div>';
  mountSheet(h,"var(--p2)");
  const pick=()=>{const f=document.getElementById("ef-from").value,to=document.getElementById("ef-to").value,ov=document.getElementById("ef-over").checked,days=S.pal.days||{},out=[];
    if(!f||!to||to<f)return out;for(let d=f;d<=to&&out.length<120;d=addDays(d,1)){const x=days[d]||{},w=e.w[wd(d)-1];if(w.n==null&&w.m==null)continue;if(!ov&&(has(x.n)||has(x.m)))continue;out.push(d)}return out};
  const info=()=>{const l=pick();document.getElementById("ef-info").textContent=l.length?("Verranno compilati "+l.length+(l.length===1?" giorno":" giorni")+", da "+shortDay(l[0])+" a "+shortDay(l[l.length-1])+"."):"Nessun giorno da compilare in questo periodo (giorni già compilati o senza dati per la media)."};
  ["ef-from","ef-to","ef-over"].forEach(id=>document.getElementById(id).addEventListener("change",info));info();
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("sf").addEventListener("submit",async ev=>{ev.preventDefault();const l=pick();
    if(!l.length){const er=document.getElementById("err");er.textContent="Scegli un periodo con giorni da compilare.";er.hidden=false;return}
    closeSheet();const days=Object.assign({},S.pal.days||{});
    l.forEach(d=>{const w=e.w[wd(d)-1],o=Object.assign({},days[d]||{});o.n=Math.round(w.n||0);o.m=Math.round(w.m||0);o.est=true;days[d]=o});
    await palSave(Object.assign({},S.pal,{days}));toast("Stima inserita in "+l.length+(l.length===1?" giorno":" giorni"));render("force")});
}}
function renderPal(){

  const tot=k=>rows.reduce((s,r)=>s+r[k],0),now=rows.find(r=>r.d===t),neg=rows.filter(r=>r.at9<0||r.end<0);

  h+='<div class="pnav'+(off?' old':'')+'"><button class="nav" id="pBack" aria-label="Settimana precedente"'+(off<=mo?' disabled':'')+'>‹</button><div class="pnr"><b>'+esc(shortDate(first))+' – '+esc(shortDate(last))+'</b><span>'+(off?'Storico · '+(-off)+(off===-1?' settimana':' settimane')+' prima del piano attuale':'Piano attuale')+'</span></div><button class="nav" id="pFwd" aria-label="Settimana successiva"'+(off>=0?' disabled':'')+'>›</button>'+(off?'<button class="btn sm" id="pNow">Piano attuale</button>':'')+'</div>';

  h+='<div class="pgrid"><div class="pest" id="pEst">'+palEstHTML()+'</div><div class="ptable"><div class="prow phead"><span>Giorno</span><span class="dsk">Pallet iniziali</span><span class="ph-in">Lavorati notturno</span><span class="ph-in">Lavorati alle 6</span><span>Pallet alle 9</span><span class="ph-in">Pallet ricevuti</span><span>Pallet a fine giornata</span></div>';
  rows.forEach(r=>{
    if(r.i%7===0)h+='<div class="pweek">'+(off?'Settimana':'Settimana '+(r.i/7+1))+' · '+esc(shortDate(r.d))+' – '+esc(shortDate(addDays(r.d,6)))+'</div>';
    const inp=(k,lab)=>'<input class="pin" type="number" inputmode="numeric" min="0" enterkeyhint="next" id="pi-'+k+'-'+r.d+'" data-d="'+r.d+'" data-k="'+k+'" value="'+(has(r.x[k])?esc(r.x[k]):'')+'" placeholder="'+palPh(r,k)+'"'+(r.x.est&&k!=="r"?' data-est="1"':'')+' aria-label="'+lab+' '+esc(shortDay(r.d))+'">';
    h+='<div class="prow'+(r.d===t?' today':'')+(r.d<t?' past':'')+'" data-row="'+r.d+'"><button class="pday" data-day="'+r.d+'"><b>'+esc(WD[wd(r.d)-1])+'</b> '+parse(r.d).getDate()+(r.x.note?' <i>✎</i>':'')+'</button>'+
      '<span class="pv dsk" data-o="ini">'+r.ini+'</span>'+inp("n","Lavorati notturno")+inp("m","Lavorati alle 6")+
      '<span class="pv'+(r.at9<0?' neg':'')+(r.est?' estv':'')+'" data-o="at9">'+(r.est?'≈':'')+r.at9+'</span>'+inp("r","Pallet ricevuti")+'<span class="pv end'+(r.end<0?' neg':'')+(r.est?' estv':'')+'" data-o="end">'+(r.est?'≈':'')+r.end+'</span></div>';
    if(r.x.note)h+='<div class="pnrow">'+esc(r.x.note)+'</div>';
  });
  h+='<div class="prow ptot"><span>Totali</span><span class="dsk"></span><span class="pv" data-t="n">'+tot("n")+'</span><span class="pv" data-t="m">'+tot("m")+'</span><span></span><span class="pv" data-t="r">'+tot("r")+'</span><span class="pv end" data-t="end">'+rows[20].end+'</span></div></div>';
  h+='</div>';

  h+='<div class="uimp"><button class="linkbtn" id="pImp">Importa dal file Excel pallet</button><span class="hint"> · sostituisce il piano attuale</span><input type="file" id="pFile" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></div>';

  document.getElementById("pCfg").onclick=openPalCfg;
  const pn=document.getElementById("pNext");if(pn)pn.onclick=palNext;
  document.getElementById("pBack").onclick=()=>{S.palOff=Math.max(mo,off-1);render("force")};
  document.getElementById("pFwd").onclick=()=>{S.palOff=Math.min(0,off+1);render("force")};
  const pw=document.getElementById("pNow");if(pw)pw.onclick=()=>{S.palOff=0;render("force")};
  document.getElementById("pCopy").onclick=palCopy;bindEst();
  main.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openPalDay(b.dataset.day));
  const ins=[...main.querySelectorAll(".pin")];

    el.addEventListener("focus",()=>el.select());
    const save=()=>{const d=el.dataset.d,k=el.dataset.k,cur=((S.pal.days||{})[d]||{})[k],v=el.value===""?"":Math.max(0,Math.round(num(el.value)));
      if(String(cur==null?"":cur)===String(v))return;palSetDay(d,{[k]:v});palRefresh()};
    el.addEventListener("change",save);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save();const n=ins[i+1];if(n)n.focus();else el.blur()}});
    el.addEventListener("blur",()=>setTimeout(()=>{const a=document.activeElement;if(S.palPending&&!(a&&a.tagName==="INPUT"&&main.contains(a))){S.palPending=false;render("force")}},50));
  });
  const f=document.getElementById("pFile");document.getElementById("pImp").onclick=()=>f.click();
  f.onchange=()=>{const file=f.files&&f.files[0];if(file)palImport(file);f.value=""};
}
/* aggiorna i numeri a cascata senza ridisegnare (così non si perde il campo in cui stai scrivendo) */
function palRefresh(){const rows=palRows();
  rows.forEach(r=>{const row=main.querySelector('[data-row="'+r.d+'"]');if(!row)return;
    [["ini",r.ini],["at9",r.at9],["end",r.end]].forEach(([k,v])=>{const e=row.querySelector('[data-o="'+k+'"]');if(e){const es=r.est&&k!=="ini";e.textContent=(es?'≈':'')+v;e.classList.toggle("neg",k!=="ini"&&v<0);e.classList.toggle("estv",es)}});
    row.querySelectorAll(".pin").forEach(i=>{if(i.dataset.k!=="r"&&i===document.activeElement)i.removeAttribute("data-est")})});
  const tot=k=>rows.reduce((s,r)=>s+r[k],0);
  [["n",tot("n")],["m",tot("m")],["r",tot("r")],["end",rows[20].end]].forEach(([k,v])=>{const e=main.querySelector('[data-t="'+k+'"]');if(e)e.textContent=v});
  const c=main.querySelector(".pchart svg");if(c)c.outerHTML=palChart(rows);
  const k=main.querySelector(".ukpi");if(k)k.outerHTML=palKpi(rows);
  const es=document.getElementById("pEst");if(es){es.innerHTML=palEstHTML();bindEst()}
  main.querySelectorAll(".pin").forEach(i=>{const r=rows.find(x=>x.d===i.dataset.d);if(r)i.placeholder=palPh(r,i.dataset.k)});
}

  const prev=()=>{const n=num(document.getElementById("pd-n").value),m=num(document.getElementById("pd-m").value),rc=num(document.getElementById("pd-r").value),a=r.ini-n-m;
    return '<div class="uprev" style="--rc:var(--accent)"><span>Pallet iniziali</span><b>'+r.ini+'</b><span>Pallet alle 9</span><b'+(a<0?' class="neg"':'')+'>'+a+'</b><span class="big">Pallet a fine giornata</span><b class="big'+(a+rc<0?' neg':'')+'">'+(a+rc)+'</b></div>'};
  let h='<h3>'+esc(longDate(d))+'</h3><div class="grid3">'+F("n","Lavorati notturno")+F("m","Lavorati alle 6")+F("r","Pallet ricevuti")+'</div><div id="pd-prev"></div>';
  h+='<div class="field"><label class="lbl" for="pd-note">Nota del giorno</label><input class="inp" type="text" id="pd-note" value="'+esc(x.note||"")+'" placeholder="Es. valutare notturno"></div>';
  h+='<div class="actions"><span class="sp"></span><button type="button" class="btn" id="cancel">Annulla</button><button type="submit" class="btn primary">Salva</button></div>';
  mountSheet(h,"var(--accent)");
  const pv=document.getElementById("pd-prev");pv.innerHTML=prev();
  ["n","m","r"].forEach(k=>document.getElementById("pd-"+k).addEventListener("input",()=>pv.innerHTML=prev()));
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("sf").addEventListener("submit",async e=>{e.preventDefault();const g=k=>document.getElementById("pd-"+k).value;
    const val=k=>g(k)===""?"":Math.max(0,Math.round(num(g(k))));
    closeSheet();await palSetDay(d,{n:val("n"),m:val("m"),r:val("r"),note:g("note").trim()});render("force")});
}

async function palCopy(){
  const rows=palRows(),p=S.pal;
  const txt="Piano pallet "+shortDate(rows[0].d)+" – "+shortDate(rows[20].d)+(p.note?"\n"+p.note:"")+"\n"+
    rows.map(r=>shortDay(r.d)+": alle 9 "+r.at9+" · fine "+r.end+((r.n||r.m||r.r)?" (notte "+r.n+", mattina "+r.m+", ricevuti "+r.r+")":"")+(r.x.note?" – "+r.x.note:"")).join("\n")+
    "\nTotali: lavorati "+rows.reduce((s,r)=>s+r.n+r.m,0)+", ricevuti "+rows.reduce((s,r)=>s+r.r,0)+", fine piano "+rows[20].end;

async function palImport(file){
  let res;try{res=AG.parsePallet(await file.arrayBuffer())}catch(e){toast("Questo file non sembra il calcolo pallet. Controlla di aver scelto il file giusto.");return}
  const n=Object.keys(res.days).length;
  mountSheet('<h3>Importa piano pallet</h3><p style="margin:0">Inizio <b>'+esc(longDate(res.start).toLowerCase())+'</b>, <b>'+n+'</b> giorni compilati.'+(res.note?'<br><span class="hint">Nota: '+esc(res.note)+'</span>':'')+'</p><div class="confirm"><span>Il piano attuale verrà sostituito.</span></div><div class="actions"><span class="sp"></span><button type="button" class="btn" id="cancel">Annulla</button><button type="submit" class="btn primary">Importa</button></div>',"var(--accent)");
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("sf").addEventListener("submit",async e=>{e.preventDefault();closeSheet();
    const keep={};Object.entries(S.pal.days||{}).forEach(([d,x])=>{if(d<res.start&&d>=addDays(res.start,-70))keep[d]=x});
    const nd=Object.assign(keep,res.days),prevDay=Object.keys(keep).some(d=>d<res.start);
    if(!prevDay&&res.initial){nd[res.start]=Object.assign({},nd[res.start]||{},{open:res.initial})}
    S.palOff=0;if(await palSave(Object.assign({},PAL0,{start:res.start,note:res.note,days:nd})))toast("Piano importato");render("force")});
}

  h+='<p class="hint sp0">Ogni turno tipo ha le sue attività di default: quando lo metti in un giorno del calendario, le attività compaiono da sole in quel giorno.</p>';
  if(!tp.length)h+='<div class="tpre"><span class="hint">Inizia da uno di questi:</span>'+PRESETS.map((p,i)=>'<button class="btn sm" data-pre="'+i+'">+ '+p.name+' '+p.start+'–'+p.end+'</button>').join("")+'</div>';
  h+='<ul class="tlist">'+tp.map(([id,t])=>'<li><button class="titem" data-tpl="'+esc(id)+'" style="--sc:'+shcOf(t.color)+'"><span class="tdot"></span><span class="tn"><b>'+esc(t.name)+'</b><span>'+esc(t.start)+'–'+esc(t.end)+'</span></span><span class="tc">'+(t.tasks||[]).length+((t.tasks||[]).length===1?' attività':' attività')+' ›</span></button></li>').join("")+'</ul></section>';
  h+='<section class="sset"><div class="shead"><h3>Account</h3></div><p class="sp0">'+(S.email?'Accesso con <b>'+esc(S.email)+'</b>':'Accesso effettuato')+'</p><p class="hint sp0">Gli stessi dati sono sul telefono e sul computer.</p><div class="pact" style="padding:8px 0 0;border:0"><button class="btn danger" id="sOut">Esci dall\'account</button></div></section>';
  main.innerHTML=h;
  document.getElementById("tNew").onclick=()=>openTplEdit(null);
  main.querySelectorAll("[data-pre]").forEach(b=>b.onclick=async()=>{const p=PRESETS[Number(b.dataset.pre)];const r=await safe(col("shtpl").add(Object.assign({tasks:[]},p)),"Turno tipo «"+p.name+"» creato")});
  main.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{S.tplId=b.dataset.tpl;setView("tpl")});
  document.getElementById("sOut").onclick=logout;
}

function renderTpl(){
  const t=S.tpl.get(S.tplId);if(!t){setView("set");return}
  const tasks=(t.tasks||[]).slice().sort((a,b)=>(Number(a.pri||3)-Number(b.pri||3))||((a.by||"99").localeCompare(b.by||"99")));
  let h='<div class="utop"><div><button class="linkbtn" id="tBack">‹ Impostazioni</button><h2 class="mname" style="--sc:'+shcOf(t.color)+'"><span class="tdot big"></span>'+esc(t.name)+'</h2><div class="hint">Turno '+esc(t.start)+'–'+esc(t.end)+' · '+tasks.length+' attività di default</div></div><button class="btn sm" id="tEdit">Modifica turno</button></div>';
  h+='<div class="ubar"><b>Attività di default</b><span class="sp"></span><button class="btn sm" id="tUse">Metti nel calendario</button><button class="btn primary sm" id="tAdd">+ Attività</button></div>';
  if(!tasks.length)h+='<div class="hello">Nessuna attività. Aggiungi quelle da fare ogni volta che fai il turno «'+esc(t.name)+'», per esempio "Controllo cassa iniziale entro le 09:30".</div>';
  else h+='<ul class="list tl2">'+tasks.map(k=>{const p=priOf(k.pri);return '<li class="item" style="--qc:'+p.c+';border-left:4px solid '+p.c+'"><div class="body" data-tt="'+esc(k.id)+'"><div class="t">'+esc(k.title)+'</div><div class="meta"><span style="color:'+p.c+';font-weight:800">'+esc(p.n)+'</span>'+(k.rep?'<span class="rep">'+esc(k.rep)+'</span>':'')+(k.by?'<span class="by">entro le '+esc(k.by)+(k.alarm!==""&&k.alarm!=null?' ⏰':'')+'</span>':'')+'</div></div></li>'}).join("")+'</ul>';
  main.innerHTML=h;
  document.getElementById("tBack").onclick=()=>setView("set");
  document.getElementById("tEdit").onclick=()=>openTplEdit(S.tplId);
  document.getElementById("tAdd").onclick=()=>openTplTask(S.tplId,null);
  document.getElementById("tUse").onclick=()=>openShift({date:today(),tpl:S.tplId});
  main.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>openTplTask(S.tplId,b.dataset.tt));
}

function openTplEdit(id){
  const orig=id?S.tpl.get(id):null;
  const st={name:orig?orig.name:"",start:orig?orig.start:"06:00",end:orig?orig.end:"14:00",color:orig?orig.color||"a":"a"};
  let conf=false,first=true;
  function draw(){
    let h='<h3>'+(orig?"Modifica turno tipo":"Nuovo turno tipo")+'</h3>';
    h+='<input class="big" id="tt-name" type="text" value="'+esc(st.name)+'" placeholder="Nome (es. Apertura)" autocomplete="off">';
    h+='<div class="row2"><div class="field"><span class="lbl">Inizio</span>'+wheelHTML("tt-start",st.start)+'</div><div class="field"><span class="lbl">Fine</span>'+wheelHTML("tt-end",st.end)+'</div></div>';
    h+='<div class="field"><span class="lbl">Colore</span>'+seg("color",SHC.map(s=>({k:s.k,n:"●"})),st.color,s=>shcOf(s.k))+'</div>';
    h+='<div class="err" id="err" hidden></div>';
    if(conf)h+='<div class="confirm"><span>Eliminare il turno tipo e le sue attività di default? I turni già messi nel calendario restano, senza attività.</span><button type="button" class="btn sm" id="cNo">No</button><button type="button" class="btn sm danger" id="cYes">Elimina</button></div>';
    h+='<div class="actions">'+(orig?'<button type="button" class="btn ghost danger" id="del">Elimina</button>':'')+'<span class="sp"></span><button type="button" class="btn" id="cancel">Annulla</button><button type="submit" class="btn primary">Salva</button></div>';
    mountSheet(h,shcOf(st.color));
    const f=document.getElementById("sf");wireWheels(f);
    const grab=()=>{st.name=document.getElementById("tt-name").value;st.start=wheelVal("tt-start")||st.start;st.end=wheelVal("tt-end")||st.end};
    f.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{grab();st.color=b.dataset.val;draw()});
    document.getElementById("cancel").onclick=closeSheet;
    const del=document.getElementById("del");if(del)del.onclick=()=>{grab();conf=true;draw()};
    const cn=document.getElementById("cNo");if(cn)cn.onclick=()=>{conf=false;draw()};
    const cy=document.getElementById("cYes");if(cy)cy.onclick=async()=>{closeSheet();await safe(col("shtpl").doc(id).delete(),"Turno tipo eliminato");setView("set")};
    f.addEventListener("submit",async e=>{e.preventDefault();grab();
      if(!st.name.trim()){const er=document.getElementById("err");er.textContent="Scrivi il nome del turno.";er.hidden=false;return}
      const data={name:st.name.trim(),start:st.start,end:st.end,color:st.color,tasks:orig?orig.tasks||[]:[]};
      closeSheet();
      if(orig)await safe(col("shtpl").doc(id).set(data),"Turno tipo salvato");
      else{const r=col("shtpl").doc();if(await safe(r.set(data),"Turno tipo creato")){S.tplId=r.id;setView("tpl")}}
    });
    if(first&&!orig)document.getElementById("tt-name").focus();first=false;
  }
  draw();
}

function openTplTask(tid,kid){
  const t=S.tpl.get(tid);if(!t)return;
  const orig=kid?(t.tasks||[]).find(k=>k.id===kid):null;
  const st={title:orig?orig.title:"",pri:orig?Number(orig.pri||2):2,rep:orig?orig.rep||"":"",by:orig?orig.by||"":"",alarm:orig&&orig.alarm!=null?String(orig.alarm):""};
  let conf=false,first=true;
  function draw(){
    const p=priOf(st.pri);
    let h='<h3>'+(orig?"Modifica":"Nuova")+' attività · '+esc(t.name)+'</h3>';
    h+='<input class="big" id="k-title" type="text" value="'+esc(st.title)+'" placeholder="Cosa c\'è da fare in questo turno?" autocomplete="off">';
    h+='<div class="field"><span class="lbl">Urgenza</span>'+seg("pri",PRI.map(x=>({k:x.k,n:x.n})),st.pri,x=>priOf(x.k).c,()=>"var(--paper)")+'</div>';
    h+='<div class="field"><span class="lbl">Reparto</span>'+seg("rep",[{k:"",n:"—"}].concat(REP.map(r=>({k:r,n:r}))),st.rep)+'</div>';
    if(st.by){h+='<div class="field"><div class="tline"><span class="lbl">Entro le</span><button type="button" id="k-noby">Togli orario</button></div>'+wheelHTML("k-by",st.by)+'</div>';
      h+='<div class="field"><label class="lbl" for="k-alarm">Sveglia</label><select class="inp" id="k-alarm">'+ALARMS.map(a=>'<option value="'+a.v+'"'+(a.v===st.alarm?' selected':'')+'>'+a.n+'</option>').join("")+'</select></div>'}
    else h+='<div class="field"><span class="lbl">Entro le</span><button type="button" class="tbtn" id="k-addby">+ Aggiungi orario e sveglia</button></div>';
    h+='<div class="err" id="err" hidden></div>';
    if(conf)h+='<div class="confirm"><span>Togliere questa attività dal turno «'+esc(t.name)+'»?</span><button type="button" class="btn sm" id="cNo">No</button><button type="button" class="btn sm danger" id="cYes">Togli</button></div>';
    h+='<div class="actions">'+(orig?'<button type="button" class="btn ghost danger" id="del">Togli dal turno</button>':'')+'<span class="sp"></span><button type="button" class="btn" id="cancel">Annulla</button><button type="submit" class="btn primary">Salva</button></div>';
    mountSheet(h,p.c);
    const f=document.getElementById("sf");wireWheels(f);
    const grab=()=>{st.title=document.getElementById("k-title").value;const w=wheelVal("k-by");if(w)st.by=w;const a=document.getElementById("k-alarm");if(a)st.alarm=a.value};
    f.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{grab();if(b.dataset.seg==="pri")st.pri=Number(b.dataset.val);else st.rep=b.dataset.val;draw()});
    const ab=document.getElementById("k-addby");if(ab)ab.onclick=()=>{grab();st.by=(t.start||"09:00");draw()};
    const nb=document.getElementById("k-noby");if(nb)nb.onclick=()=>{grab();st.by="";st.alarm="";draw()};
    document.getElementById("cancel").onclick=closeSheet;
    const save=async list=>safe(col("shtpl").doc(tid).set(Object.assign({},t,{tasks:list})));
    const del=document.getElementById("del");if(del)del.onclick=()=>{grab();conf=true;draw()};
    const cn=document.getElementById("cNo");if(cn)cn.onclick=()=>{conf=false;draw()};
    const cy=document.getElementById("cYes");if(cy)cy.onclick=async()=>{closeSheet();await save((t.tasks||[]).filter(k=>k.id!==kid));toast("Attività tolta")};
    f.addEventListener("submit",async e=>{e.preventDefault();grab();
      if(!st.title.trim()){const er=document.getElementById("err");er.textContent="Scrivi cosa c'è da fare.";er.hidden=false;return}
      const item={id:orig?orig.id:uid36(),title:st.title.trim(),pri:st.pri,rep:st.rep,by:st.by||"",alarm:st.by?st.alarm:""};
      const list=(t.tasks||[]).filter(k=>k.id!==item.id).concat(item);
      closeSheet();if(await save(list))toast(orig?"Attività salvata":"Attività aggiunta al turno");
    });
    if(first&&!orig)document.getElementById("k-title").focus();first=false;
  }
  draw();
}

/* ---------- HOME ---------- */
function renderHome(){
  const t=today(),hr=new Date().getHours(),occ=tasksOn(t,true),open=occ.filter(o=>!o.done).sort((a,b)=>(Number(a.it.pri||3)-Number(b.it.pri||3))||((a.it.by||"99").localeCompare(b.it.by||"99")));
  const urg=open.filter(o=>Number(o.it.pri)===1).length,sh=shiftsOn(t),done=occ.length-open.length;
  const rows=palRows(null,0),now=rows.find(r=>r.d===t),pn=palProd(rows,"n"),pm=palProd(rows,"m"),f=x=>(Math.round(x*10)/10).toLocaleString("it-IT");
  let h='<div class="home"><div class="hhead"><div class="rel">'+(hr<13?'Buongiorno':hr<18?'Buon pomeriggio':'Buonasera')+'</div><h2>'+esc(longDate(t))+'</h2></div><div class="hgrid">';
  h+='<button class="hcard" data-go="day"><span class="hic" style="--hc:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span><span class="hti">Calendario</span>'+
    '<span class="hsh">'+(sh.length?sh.map(s=>'<i style="--sc:'+shcOf(s.it.color)+'">'+esc(s.it.title||"Turno")+' '+esc(s.it.start||"")+'–'+esc(s.it.end||"")+'</i>').join(""):'<i class="none">Nessun turno oggi</i>')+'</span>'+
    '<span class="hnum"><b>'+open.length+'</b> da fare'+(urg?' · <b class="u">'+urg+'</b> urgenti':'')+' · '+done+' fatte</span>'+
    (open.length?'<span class="hlist">'+open.slice(0,3).map(o=>'<span style="--pc:'+priOf(o.it.pri).c+'">'+esc(o.it.title)+(o.it.by?' <em>'+esc(o.it.by)+'</em>':'')+'</span>').join("")+(open.length>3?'<span class="more">+ altre '+(open.length-3)+'</span>':'')+'</span>':'<span class="hlist"><span class="none">Tutto fatto per oggi ✓</span></span>')+
    '<span class="hgo">Apri il calendario ›</span></button>';
  h+='<button class="hcard" data-go="pal"><span class="hic" style="--hc:var(--p2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="9" rx="1"/><path d="M2 18h20M5 18v3M12 18v3M19 18v3M4 14v4M20 14v4M12 5v9"/></svg></span><span class="hti">Strumento pallet</span>'+
    (now?'<span class="hnum">Oggi: <b>'+now.at9+'</b> alle 9 · <b>'+now.end+'</b> a fine giornata</span>':'<span class="hnum">Piano '+esc(shortDate(rows[0].d))+' – '+esc(shortDate(rows[20].d))+'</span>')+
    '<span class="hlist"><span style="--pc:var(--accent)">Notturno: '+f(pn.avg)+' pallet/notte</span><span style="--pc:var(--p2)">Alle 6: '+f(pm.avg)+' pallet/turno</span></span><span class="hgo">Apri lo strumento pallet ›</span></button>';
  h+='<button class="hcard" data-go="set"><span class="hic" style="--hc:var(--muted)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span class="hti">Impostazioni</span><span class="hnum">'+S.tpl.size+(S.tpl.size===1?' turno tipo':' turni tipo')+'</span><span class="hlist"><span class="none">Turni con attività di default, account</span></span><span class="hgo">Apri ›</span></button>';
  h+='</div></div>';
  main.innerHTML=h;
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==="day"){S.date=today();S.focus=null}setView(g)});
}

/* ---------- avvisi e sveglie ---------- */
let toastT;
function toast(m){const r=document.getElementById("toastRoot");r.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",2600)}
let audio=null;
document.addEventListener("pointerdown",()=>{if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}});
function beep(){if(!audio)return;try{const t=audio.currentTime;[0,.35,.7].forEach(x=>{const g=audio.createGain(),osc=audio.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(.0001,t+x);g.gain.exponentialRampToValueAtTime(.25,t+x+.02);g.gain.exponentialRampToValueAtTime(.0001,t+x+.25);osc.connect(g).connect(audio.destination);osc.start(t+x);osc.stop(t+x+.3)})}catch(e){}}
const fired=new Set((ls.get("ag2.fired")||"").split("|").filter(Boolean));
function checkAlarms(){
  if(!ready())return;const t=today(),now=new Date();
  for(const o of tasksOn(t,false)){
    const it=o.it;if(o.done||!it.by||it.alarm===""||it.alarm==null)continue;
    const [hh,mm]=it.by.split(":").map(Number),at=new Date();at.setHours(hh,mm-Number(it.alarm),0,0);
    const k=o.key+"@"+t;
    if(now>=at&&now-at<3*3600e3&&!fired.has(k)){fired.add(k);ls.set("ag2.fired",[...fired].slice(-200).join("|"));showAlarm(o);break}
  }
}
function showAlarm(o){
  const r=document.getElementById("alarmRoot");
  r.innerHTML='<div class="alarm" role="alert"><span class="l">Promemoria · entro le '+esc(o.it.by)+'</span><b>'+esc(o.it.title)+'</b><span class="hint">'+esc(priOf(o.it.pri).n)+(o.it.rep?' · '+esc(o.it.rep):'')+'</span><div class="actions"><button class="btn sm primary" id="alD">Fatta</button><button class="btn sm" id="alO">Ok</button></div></div>';
  beep();
  document.getElementById("alO").onclick=()=>r.innerHTML="";
  document.getElementById("alD").onclick=()=>{r.innerHTML="";toggle(o)};
}
let lastDay=today();
setInterval(()=>{const t=today();if(t!==lastDay){if(S.date===lastDay)S.date=t;lastDay=t;render()}checkAlarms()},20000);

render();
boot().catch(()=>{main.innerHTML='<div class="hello"><b>Agenda non disponibile.</b> Riapri l\'app.</div>'});
})();
</script>
