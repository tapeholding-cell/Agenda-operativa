name: Costruisci app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Prepara la parte web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Controlla SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo "::error title=SDK::SDK Android non trovato sul runner"; exit 1; }
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: Costruisci l'app Android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log || {
            msg=$(grep -E "What went wrong|error:|Exception|FAILURE|> " ../gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Errore Android::$msg"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ../AgendaOperativa.apk

      - name: Pubblica l'app da scaricare
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Agenda Operativa 1.${{ github.run_number }}
          body: Scarica AgendaOperativa.apk sul telefono Android e installalo.
          files: AgendaOperativa.apk
          make_latest: true

      - name: Pubblica la versione per il computer
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
